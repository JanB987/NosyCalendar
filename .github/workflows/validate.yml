name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BROWSER_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Type-aware scanner rules and source/manifest coverage
        run: npm run lint
      - name: Manifest and project/generated CSS checks
        run: npm run check:publication
      - name: Regression and style checks
        run: npm test
      - name: Real browser and live style checks
        run: npm run check:browser
      - name: Minimum API declarations (automatic clean install)
        run: npm run check:min-api
      - name: Current API declarations
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Release metadata, embedded notices and syntax
        run: npm run check:release
      - name: Generated files are reproducible
        run: git diff --exit-code -- styles.css THIRD-PARTY-NOTICES.txt package-lock.json tests/minimum-api/package-lock.json
